  url: http://localhost:9090/cart-item/1?quantity=1&saveForLater=0
  params:
    - name: quantity
      value: "1"
      type: query
    - name: saveForLater
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

