info:
  name: Get Order Item
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:9090/order-item/9999
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success 1 - item 1
    request:
      url: http://localhost:9090/order-item/1
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Sun, 31 May 2026 05:16:39 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "status": 200,
            "message": "OrderItem fetched successfully",
            "result": {
              "orderItemId": 1,
              "orderId": null,
              "product": {
                "productId": 7,
