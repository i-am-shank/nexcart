              "addedOn": "2026-04-04T21:50:23.74731",
              "updatedOn": "2026-04-05T09:43:24.4724507"
            }
          }
  - name: Update User - error - 2 - Invalid imageName
    request:
      url: http://localhost:9090/users/3
      method: PUT
      body:
        type: json
        data: |-
          {
            "imageName": "rahulPic.jpeg"
          }
