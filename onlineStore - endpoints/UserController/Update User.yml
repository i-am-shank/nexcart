info:
  name: Update User
  type: http
  seq: 2

http:
  method: PUT
  url: http://localhost:9090/users/3
  body:
    type: json
    data: |-
      {
        "imageName": "rahulNew.png"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Update User - error - 1
    request:
      url: http://localhost:9090/users/3
      method: PUT
      body:
        type: json
        data: |-
          {
            "name": "A"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Sun, 05 Apr 2026 04:12:43 GMT
        - name: connection
          value: close
      body:
        type: json
        data: |-
          {
            "status": 400,
            "message": "name: Name must be between 2 and 100 characters",
            "result": null
          }
  - name: Update User - success - 1
    request:
      url: http://localhost:9090/users/3
      method: PUT
      body:
        type: json
        data: |-
          {
            "name": "Raahul Verma"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Sun, 05 Apr 2026 04:13:24 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "status": 200,
            "message": "User updated successfully",
            "result": {
              "userId": 3,
              "name": "Raahul Verma",
