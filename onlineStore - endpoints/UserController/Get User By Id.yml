info:
  name: Get User By Id
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:9090/users/2
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success 1
    request:
      url: http://localhost:9090/users/3
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Sat, 04 Apr 2026 16:38:15 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "status": 200,
            "message": "User fetched successfully for given userId",
            "result": {
              "userId": 3,
              "name": "Rahul Verma",
              "email": "rahul.verma@example.com",
              "gender": "Male",
              "bio": "Tech lover & gadget reviewer : Java developer passionate about Spring Boot and microservices.",
              "imageName": "rahul.jpg",
              "addedOn": "2026-04-04T21:50:23.74731",
              "updatedOn": null
            }
          }
