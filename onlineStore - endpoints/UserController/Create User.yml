  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:9090/users
  body:
    type: json
    data: |-
      {
        "name": "Rohit Kumar",
        "email": "rohit.kumar@example.com",
        "password": "rohit1234",
        "gender": "Male",
        "bio": "Tech enthusiast and cricket lover.",
        "imageName": "rohit_profile.jpg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

