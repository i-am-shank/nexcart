info:
  name: Get Addresses for User
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:9090/address/user/2
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

