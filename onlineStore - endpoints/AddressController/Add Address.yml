info:
  name: Add Address
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:9090/address/user/7
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Rohit Kumar",
        "building": "House 221B",
        "street": "Church Street",
        "city": "Kolkata",
        "state": "West Bengal",
        "pinCode": "700014",
        "phoneNumber": "3456456756"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success 1
    request:
      url: http://localhost:9090/address/user/2
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "Rahul Sharma",
            "building": "Flat 302",
            "street": "MG Road",
            "city": "Bangalore",
            "state": "Karnataka",
            "pinCode": "560001",
            "phoneNumber": "9876543210"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Mon, 25 May 2026 18:11:19 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "status": 200,
            "message": "Address added successfully",
            "result": {
              "addressId": 1,
