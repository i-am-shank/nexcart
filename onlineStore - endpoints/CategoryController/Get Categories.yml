info:
  name: Get Categories
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:9090/category/list?categoryIds=2,4
  params:
    - name: categoryIds
      value: 2,4
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Get Categories - success 1
    request:
      url: http://localhost:9090/category/list?categoryIds=2,3
      method: GET
      params:
        - name: categoryIds
          value: 2,3
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Sat, 02 May 2026 09:19:32 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "status": 200,
            "message": "Categories fetched successfully",
            "result": [
              {
                "categoryId": 2,
                "title": "Musical Instruments",
                "description": "Musical instruments, mics, speaker, and everything",
                "coverImageFileId": null
              },
              {
                "categoryId": 3,
                "title": "Fruits and Vegetables",
                "description": "All kinds of fruits, veggies you wanna buy",
                "coverImageFileId": null
              }
            ]
          }
