info:
  name: Update Product
  type: http
  seq: 3

http:
  method: PUT
  url: http://localhost:9090/product/5
  body:
    type: json
    data: |-
      {
        "categoryId": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: success 1
    request:
      url: http://localhost:9090/product/2
      method: PUT
      body:
        type: json
        data: |-
          {
            "title": "Product 02",
            "description": "product 02 desc",
            "remainingQuantity": 7,
            "price": 79.89
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Wed, 06 May 2026 03:25:49 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "status": 200,
            "message": "Product updated successfully",
            "result": {
              "productId": 2,
              "title": "Product 02",
              "description": "product 02 desc",
              "price": 79.89,
              "discountPercentage": 13.0,
              "remainingQuantity": 7,
              "inStock": true
            }
          }
  - name: error 1 - product not found
    request:
      url: http://localhost:9090/product/16
      method: PUT
