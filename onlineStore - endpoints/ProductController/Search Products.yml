info:
  name: Search Products
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:9090/product/search?searchKeyword=Product&pageNumber=0&pageSize=2&sortBy=productPrice&sortDirection=DESC
  params:
    - name: searchKeyword
      value: Product
      type: query
    - name: pageNumber
      value: "0"
      type: query
    - name: pageSize
      value: "2"
      type: query
    - name: sortBy
      value: productPrice
      type: query
    - name: sortDirection
      value: DESC
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: success 1 - pageNo, pageSize null
    request:
      url: http://localhost:9090/product/search?searchKeyword=02
      method: GET
      params:
        - name: searchKeyword
          value: "02"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Wed, 06 May 2026 03:23:36 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "status": 200,
            "message": "Searched products fetched successfully",
            "result": {
              "items": [
                {
                  "productId": 2,
                  "title": "Product 02",
                  "price": 99.89,
                  "discountPercentage": 13.0
                }
              ],
              "isFirstPage": true,
              "isLastPage": true,
              "pageNumber": 0,
