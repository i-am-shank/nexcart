    request:
      url: http://localhost:9090/product
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "",
            "description": "product 01 desc",
            "price": 134.45632,
            "discountPercentage": 15.6789,
            "remainingQuantity": 0
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Tue, 05 May 2026 02:30:33 GMT
        - name: connection
          value: close
      body:
