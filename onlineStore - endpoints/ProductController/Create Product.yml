info:
  name: Create Product
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:9090/product
  body:
    type: json
    data: |-
      {
          "title": "Adidas Football Shoes",
          "description": "Lightweight football studs with enhanced grip for turf and ground play",
          "price": 4599.75,
          "discountPercentage": 12,
          "remainingQuantity": 14,
          "categoryId": 4
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
