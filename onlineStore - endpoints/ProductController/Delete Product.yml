        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Wed, 06 May 2026 03:42:41 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
