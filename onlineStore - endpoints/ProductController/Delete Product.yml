    request:
      url: http://localhost:9090/product/3
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Wed, 06 May 2026 03:41:31 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "status": 200,
            "message": "Product deleted successfully",
            "result": null
          }
