info:
  name: Get Product Details
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:9090/product/8
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: success 1 - inStock true
    request:
      url: http://localhost:9090/product/1
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Tue, 05 May 2026 03:42:45 GMT
        - name: keep-alive
          value: timeout=60
        - name: connection
          value: keep-alive
      body:
        type: json
        data: |-
          {
            "status": 200,
            "message": "Product details fetched successfully",
            "result": {
              "productId": 1,
              "title": "Product 01",
              "description": "product 01 desc",
              "price": 99.89,
              "discountPercentage": 13.0,
              "remainingQuantity": 16,
              "inStock": true
            }
          }
  - name: success 2 - inStock false
    request:
      url: http://localhost:9090/product/3
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: date
          value: Wed, 06 May 2026 03:39:06 GMT
